<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
    <div class="heading"> Tic Tac Toe</div><br>
    <div class="container">
        <h3>Lets start the game..</h3>
        <div id="mode-selection" class="mode-selection"></div>
        <form id="game-setup" class="game-setup mode-selection" hidden>
            <h3 id="setup-title">Game setup</h3>
            <label for="player-name" id="player-name-label">Your name</label>
            <input id="player-name" name="playerName" type="text" maxlength="60" autocomplete="off">
            <div id="second-player-field" hidden>
                <label for="second-player-name">Player O name</label>
                <input id="second-player-name" name="secondPlayerName" type="text" maxlength="60" autocomplete="off">
            </div>
            <div id="starter-field">
                <label for="starter">Who plays first?</label>
                <select id="starter" name="starter">
                    <option value="human">You first (X)</option>
                    <option value="ai">AI first (X)</option>
                    <option value="alternate">Alternate (you start)</option>
                </select>
            </div>
            <button type="submit">Start game</button>
            <button type="button" onclick="cancelSetup()">Cancel</button>
        </form>
        <div id="game-area" hidden>
        <div id="player-info" aria-live="polite"></div>
        <div id="scoreboard" class="scoreboard" role="status" aria-label="Match scores"></div>
        <div id="next" class="next-move"></div>
        <table class="game-board">
            <tr>
                <td id="td0"></td>
                <td id="td1"></td>
                <td id="td2"></td>
            </tr>
            <tr>
                <td id="td3"></td>
                <td id="td4"></td>
                <td id="td5"></td>
            </tr>
            <tr>
                <td id="td6"></td>
                <td id="td7"></td>
                <td id="td8"></td>
            </tr>
        </table>
        </div>
    </div>
</div>
    <script src="tictactoe.js"></script>
    <script src="minimax.js"></script>
</body>
</html>
